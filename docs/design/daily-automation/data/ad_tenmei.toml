# アナダン 天冥値データ — ダンジョン定義 + クリア時天冥アップキャラ対応
# source: https://altema.jp/anaden/anotherdungeon (2026-11-01 時点)
#
# 用途:
#   - ticket_digest の計画生成 (上げたいキャラ → 周回するダンジョンを逆引き)
#   - `anaden-tool plan-tenmei <キャラ名>` (新規ツール、未実装) の入力データ
#
# 備考:
#   - 天冥アップは「主人公・ストーリー加入 (配布) キャラ」対象。確率は低いが
#     クリア報酬枠の天冥値合計を上げるほどアップ機会が増える。
#   - alignment: ten=天 / mei=冥 / both=天冥両方 / all_dist=全配布キャラ
#   - key: H=グリーン1, VH=レッド1, iseki=グリーン2
#   - skip_target: ねこの手特急券のスキップ対象 (Ver3.10.10 時点)

version = 1
source = "https://altema.jp/anaden/anotherdungeon"

# --- 報酬枠解放に必要な天冥値 ---

[reward_slots]
vh = [24, 60, 120]
hard = [0, 24, 96]
iseki_vh = [48, 120, 180]
iseki_hard = [0, 60, 120]
gallerea = [24, 60, 120, 240, 360]

