[package]
name = "review_gate_eval"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "review-gate 定量評価メトリクス集計 (recall / false positive rate / consensus validity)"

# 評価用スクリプト群のため workspace には含めない（crate 依存・結合原則への影響ゼロ）。
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[lints.clippy]
panic = "deny"
expect_used = "deny"
unwrap_used = "deny"
