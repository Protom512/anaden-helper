[package]
name = "anaden-studio"
description = "Template authoring GUI for anaden vision pipeline"
version.workspace = true
edition.workspace = true

[[bin]]
name = "anaden-studio"
path = "src/main.rs"

[[bench]]
name = "log_snapshot_bench"
harness = false
# cargo test (nextest 未環境のフォールバック) でベンチ本体まで走らないよう
# 明示的に test = false とする (criterion は cargo bench 経由のみ実行)。
test = false

[dependencies]
anaden-core.workspace = true
anaden-device.workspace = true
anaden-strategies.workspace = true
anaden-vision.workspace = true
anyhow.workspace = true
eframe = "0.34.3"
egui = "0.34"          # eframe 0.34.3 と同系バージョン (re-export ではなく直接依存)
image.workspace = true
rfd = "0.17.2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
ab_glyph = "0.2"
criterion = "0.8.2"
tempfile.workspace = true
