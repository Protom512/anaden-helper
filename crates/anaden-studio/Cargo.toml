[package]
name = "anaden-studio"
description = "Template authoring GUI for anaden vision pipeline"
version.workspace = true
edition.workspace = true

[[bin]]
name = "anaden-studio"
path = "src/main.rs"

[[bench]]
name = "log_snapshot_bench"
harness = false
test = false

[dependencies]
anaden-core.workspace = true
anaden-device.workspace = true
anaden-engine.workspace = true
anaden-strategies.workspace = true
anaden-vision.workspace = true
eframe = { version = "0.34.3", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
] }
egui = "0.34"
image.workspace = true
rfd = "0.17.2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
ab_glyph = "0.2"
anyhow.workspace = true
criterion = "0.8.2"
tempfile.workspace = true
