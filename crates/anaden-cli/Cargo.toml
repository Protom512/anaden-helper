[package]
name = "anaden-cli"
description = "CLI entry point for Another Eden automation"
version.workspace = true
edition.workspace = true

[lib]
name = "anaden_cli_contract"
path = "src/contract.rs"

[[bin]]
name = "anaden"
path = "src/main.rs"

[[bin]]
name = "anaden-tool"
path = "src/template_tool.rs"

[dependencies]
anaden-core = { workspace = true }
anaden-device = { workspace = true }
anaden-vision = { workspace = true }
anaden-engine = { workspace = true }
anaden-strategies = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
async-trait = { workspace = true }
clap = { version = "4", features = ["derive"] }
image = { workspace = true }
imageproc = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
