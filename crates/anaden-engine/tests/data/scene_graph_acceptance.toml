fixture = "ad_select_live_1918x1048.png"
reason = "the difficulty dialog and the skip (tokkyu-ken) button have no capture in the corpus; ad_select hardware rows are detected but the click chain past row selection is unverified"

[[gap]]
name = "def_008_login_goal_unreachable_in_town"
tasks = ["LoginWaitFieldPc", "FieldHudTopPc"]
fixtures = [
  "field_live_2880x1620.png",
  "field_live_20261110_3783x2128.png",
  "field_hud_live_2880x1620.png",
]
reason = "hud_top (currency bar) is absent in town field frames (DEF-008), so the login/nav terminal task never matches on arrival; town arrival is carried by the FieldTownBarPc watch instead of the pipeline goal"

