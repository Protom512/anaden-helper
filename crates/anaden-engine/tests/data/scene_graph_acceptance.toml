[[blocked]]
name = "title_cold_boot_before_logo"
fixture = "title_boot_degenerate_1952x1098.png"
degenerate = true
reason = "cold boot frame renders before the title logo, so by design nothing matches; the driver survives on NoMatch retry instead of a boot-state anchor, which needs a dedicated loading/boot template"

[[blocked]]
