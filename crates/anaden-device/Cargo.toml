[package]
name = "anaden-device"
description = "PC (Windows) device communication layer (capture/input/launch)"
version.workspace = true
edition.workspace = true

[dependencies]
anaden-core = { workspace = true }
tokio = { workspace = true }
image = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# PC版 Windows API プローブ(入力/キャプチャ/起動)。features はルート [workspace.dependencies]
# で一括定義。Windows 専用コードは cfg(windows) で囲む。Linux ビルドには依存しない。
[target.'cfg(windows)'.dependencies]
windows = { workspace = true }
