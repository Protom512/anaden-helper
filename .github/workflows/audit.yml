name: audit

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

jobs:
  cargo-audit:
    name: cargo-audit (RustSec advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - uses: Swatinem/rust-cache@v2

      - name: Run cargo audit
        run: cargo audit
