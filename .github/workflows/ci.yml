name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (fmt, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup component add rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

  test-windows:
    name: test-windows (nextest on Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain components
        shell: pwsh
        run: rustup component add rustfmt clippy

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo nextest run --workspace

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

  quality-gates:
    name: quality-gates (test tampering / gate self-tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Node test suite
        run: node scripts/quality/run_node_tests.mjs

      - name: Comment gate
        run: node scripts/quality/comment_gate.mjs

      - name: Assert tests untouched (pull request)
        if: github.event_name == 'pull_request'
        run: node scripts/quality/assert_tests_untouched.mjs "${{ github.event.pull_request.base.sha }}"

      - name: Assert tests untouched (push)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: node scripts/quality/assert_tests_untouched.mjs "${{ github.event.before }}"

  metrics-gates:
    name: metrics-gates (complexity / duplication) - advisory for now
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: Swatinem/rust-cache@v2

      - name: Install metrics tools
        run: |
          cargo install --locked --version 0.4.0 cccc-rs-cli
          cargo install --locked --version 0.5.0 similarity-rs

      - name: Complexity gate
        run: node scripts/quality/complexity_gate.mjs

      - name: Duplication gate
        run: node scripts/quality/duplication_gate.mjs

