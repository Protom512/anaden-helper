[workspace]
resolver = "2"
members = [
    "crates/anaden-core",
    "crates/anaden-device",
    "crates/anaden-vision",
    "crates/anaden-engine",
    "crates/anaden-strategies",
    "crates/anaden-cli",
    "crates/anaden-studio",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anaden-core = { path = "crates/anaden-core" }
anaden-device = { path = "crates/anaden-device" }
anaden-vision = { path = "crates/anaden-vision" }
anaden-engine = { path = "crates/anaden-engine" }
anaden-strategies = { path = "crates/anaden-strategies" }

image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg", "rayon"] }
imageproc = "0.25"

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

thiserror = "2"
anyhow = "1"

async-trait = "0.1"

tempfile = "3"

windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Graphics_Capture",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
] }
