name      = "MenuPcInfo"
state     = "menu_pc"
algorithm = "sse"
template  = "info.png"
# PC版(Windows 16:9) menu シーン参照テンプレ (Task #28 / Issue #6 / 親 Issue #5)。
# Issue #268: 3.17.50 メニューバーUI変更への追従 (導出手法・座標系は party.toml 参照)。
# info = 左から8タイル目 (ラベル「その他」— 4x ズームクロップで判読。ギアアイコン。
# 7タイル目は新設の「お知らせ」で、旧7対象には相当タスクなし)。
#
# 生成コマンド (絶対命令: 生成コマンドをログに残す):
#   resize_crop_template e5_menu_now.png templates/scenes/menu_pc/info.png \
#       --letterbox 10 --roi 804,567,92,93
roi       = [804, 567, 92, 93]
threshold = 0.95
