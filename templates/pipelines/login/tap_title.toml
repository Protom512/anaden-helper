name      = "LoginTapTitlePc"
state     = "title_pc"
algorithm = "ccoeff"
# ログインパイプライン slice 1/2 (Issue #146 / UC-2 / T4)。最小構成。
# title 画面の version_label (固定テクスチャ・点滅非依存) で title 画面到達を検出し、
# click_rect で Tap-to-Start をタップする。認識手法は nav_to_field_pc/tap_to_start.toml
# と同一パターン (検出テンプレ ≠ タップ対象)。
#
# 座標系: RAW 1258x708 ピクセル空間 (PC版 GetClientRect 実測)。nav_to_field_pc と同一。
template  = "../../scenes/title_pc/version_label.png"
roi       = [65, 7, 121, 35]
threshold = 0.80
# タップ位置: "Tap to Start" (nav_to_field_pc/tap_to_start.toml と同座標)。
action    = { type = "click_rect", roi = [900, 466, 30, 30] }
# 次遷移: Field HUD 待ちへ。
next      = ["LoginWaitFieldPc"]
