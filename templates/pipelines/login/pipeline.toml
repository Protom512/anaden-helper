# ログインパイプライン manifest (Issue #146 / UC-2 / T4)。
# TaskDef (tap_title.toml / wait_field.toml) とは分離された宣言層。
# schema 詳細は docs/goal-manifest.md および templates/pipelines/field_loop_pc/pipeline.toml 参照。

# 最初に実行する TaskDef。tap_title.toml の name="LoginTapTitlePc" と一致すること。
start_task = "LoginTapTitlePc"

# UC-2: Field 到達 (TemplateMatch) でログイン完了とみなし停止する。
# 最小構成: title 画面の Tap-to-Start をタップし、その後のロード/自動ログインを
# Field HUD 検出で完了判定する (Issue #146 では起動可能性のみを受入基準とし、
# 認識精度は別チケット)。Timeout は実機調整前の安全弁。
[[goal]]
name = "login_field_reached"
[goal.stop]
TemplateMatch = { task = "LoginWaitFieldPc", confidence = 0.70, Timeout = { secs = 120 } }
