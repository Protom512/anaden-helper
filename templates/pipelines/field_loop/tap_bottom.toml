name      = "TapBottomStable"
state     = "Field"
algorithm = "ccoeff"
template  = "bottom_stable.png"
# 【Issue #187 監査対象外 (allowlist 登録)】bottom_stable.png は輝度 stddev 2.80 の
# 無構造テンプレート (Issue #184 lane3 報告 2.89・監査実測 2.80 は同一資産。
# 閾値 20.0 未満 = TM_CCOEFF_NORMED が
# 原理的に match できず恒久 NoMatch — Issue #182 version_label と同種)。
# 上記の conf=0.9999-1.0000 は旧テンプレでの実測であり、現テンプレでは期待できない。
# 実機再撮影が現状不可能 (android 用 pipeline だがゲームは PC 版を起動中) のため
# 一括監査テスト (crates/anaden-vision/tests/template_bank_audit.rs の
# KNOWN_UNSTRUCTURED) に登録して経過観察する。
#
# 再撮影手順 (Issue #182 手順の android 版):
#   1. 実機 (Pixel7a) のフィールド画面を scrcpy/adb でキャプチャする。
#   2. 幅1280基準へ正規化 (2400x1080 → 1280x576) する。
#   3. 下部UI帯 (パーティステータス) の中から輝度 stddev >= 20.0 の構造ある領域を
#      クロップして bottom_stable.png を再生成する (テンプレ差し替え)。
#   4. 監査テストの KNOWN_UNSTRUCTURED から当該エントリを削除する
#      (stale 検出が削除を強制する — 構造を取り戻したテンプレの allowlist 残留を FAIL)。
#
# ROI: 幅1280基準座標系(実機 Pixel7a 2400x1080 → 正規化 1280x576)。
# フィールド画面 下部UI帯(パーティステータス)。stable_region で5枚間 diff=0(完全安定)。
# テンプレは正規化空間(80x64)で作成。5枚の field キャプチャで conf=0.9999-1.0000。
# 変動に強い理由: 下部UI帯は固定UI(時間/天候/キャラ移動に無関係)、かつ
# lumvar 高(テクスチャ豊富)で単色バー(既存 top.png の失敗 conf 0.5756)と違う。
roi       = [820, 470, 200, 90]
threshold = 0.80
# click_self: 認識したUI帯(matched_region 中心)を scrcpy-touch でタップ。
# 効果は発火前後キャプチャで誠実判定。
action    = { type = "click_self" }
next      = []
