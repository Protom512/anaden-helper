name      = "LoadGamePc"
state     = "title_pc"
algorithm = "ccoeff"
# PC版(Windows 16:9) nav_to_field slice (T3 / 親 Issue #5)。pc-scoped 名前空間(nav_to_field_pc/)。
# Tap-to-Start 発火後に出る "Continue / Load" ボタンをタップしゲームをロードする中間 slice。
# 既存 _title_load/load_game.toml(threshold=0.01 ハック) を PC 16:9 RAW 空間で置き直す。
#
# 座標系: **RAW 1258x708 ピクセル空間**(PC版 GetClientRect 実測)。ScreenScaler は常に1280幅基準へリサイズ（早期return廃止）。
#
# 検出テンプレ: scenes/title_pc/title_logo_corner.png(title ロゴ固定角マーク・点滅非依存)。
#   Tap-to-Start 後も title ロゴは残留するため、これを load 画面到達検出に使う。
#   Issue #208 で TapToStartPc も同アンカーへ統一 (旧 version_label アンカーは内容可変
#   資産で cross-capture 不安定だったため廃止。ステップ弁別はテンプレ差ではなく
#   pipeline の next 状態機械と click_rect タップ位置の差で行う)。
template  = "../../scenes/title_pc/title_logo_corner.png"
# 検出 ROI: title_logo_corner の needle 再クロップ元と同一位置 (Issue #192)。
#   needle (120x120) は operator probe 2026-07-07 の title_pc_probe.png (RAW 1258x708) から
#   find_logo_corner_subfeature.rs で最高テクスチャエネルギーの 120x120 窓として
#   [624,263,120,120] を選出・クロップされた (scenes/title_pc/title_logo_corner.toml 参照)。
#   旧値 [140,60,60,60] は Issue #13 の 20:9 自己クロップ暫定値のコピーで、needle 120x120 が
#   roi 60x60 に収まらず ccoeff が恒久 NoMatch だった (#182 version_label と同種の片側更新バグ:
#   PR #47 が needle を再クロップした際に消費者側 roi を対更新しなかった)。
#   Issue #208: needle==roi 幅のぴったり指定はキャプチャ間ドリフト (実測 (+2,-1) px) で
#   conf 0.99→0.78 に崩壊するため、原点 [624,263,120,120] 中心のスラック窓へ拡張
#   (login/tap_title・nav_to_field_pc/tap_to_start と同一の対更新)。
#   Issue #210 実機検証 (2026-09-24): live「ロードゲーム」タイトルで needle 最良位置が
#   (625,243) と約 20px 上方へドリフトしたため、観測 envelope を ±20px で囲む
#   [604,223,160,180] へ再拡張 (旧窓 [614,253,140,140] の厳密スーパーセット)。
roi       = [604, 223, 160, 180]
threshold = 0.80
# タップ位置: "Continue/Load" ボタン中央。
#   legacy _title_load/load_game.toml の click_rect roi=[625,273,30,30] (1280x720 正規化) を
#   RAW 1258x708 換算(比率維持): x≈614, y≈268。
#   実機レイアウト確認後(T1) に微調整。click_rect で静的タップ。
action    = { type = "click_rect", roi = [600, 258, 30, 30] }
# 次遷移: field 到達検出(FieldHudTopPc) へ。
next      = ["FieldHudTopPc"]
